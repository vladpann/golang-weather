services:
  weather:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/weather/Dockerfile
    container_name: weather
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - POSTGRES_HOST=weather-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - SESSION_TTL=${SESSION_TTL}
      - SESSION_CLEANUP_INTERVAL=${SESSION_CLEANUP_INTERVAL}
      - OPENWEATHER_API_BASE_URL=${OPENWEATHER_API_BASE_URL}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - OPENWEATHER_REQUESTS_PER_MINUTE=${OPENWEATHER_REQUESTS_PER_MINUTE}
      - OPENWEATHER_QUEUE_SIZE=${OPENWEATHER_QUEUE_SIZE}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - TIME_ZONE=${TIME_ZONE}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    expose:
      - '5050'
    restart: always

  weather-postgres:
    image: postgres:18.1-bookworm
    container_name: weather-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  weather-postgres-test:
    image: postgres:18.1-bookworm
    container_name: weather-env-postgres-test
    environment:
      - POSTGRES_USER=${POSTGRES_USER_TEST}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_TEST}
      - POSTGRES_DB=${POSTGRES_DB_TEST}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata-test:/var/lib/postgresql
    restart: always

  weather-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: weather-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:weather-postgres:5432
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'

  port-forwarder-test:
    image: alpine/socat:1.8.0.3
    container_name: weather-postgres-test-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:weather-postgres-test:5432
    ports:
      - '127.0.0.1:${POSTGRES_PORT_TEST:-5432}:5432'

  nginx:
    image: nginx:1.27-alpine
    container_name: weather-nginx
    ports:
      - '80:80'
    volumes:
      - ${PROJECT_ROOT}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROJECT_ROOT}/public:/usr/share/nginx/html:ro
    restart: always
    depends_on:
      - weather
