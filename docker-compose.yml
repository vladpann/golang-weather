services:
  weather:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/weather/Dockerfile
      args:
        VERSION: ${VERSION:-prod}
    image: weather:${VERSION:-prod}
    container_name: weather
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - POSTGRES_HOST=weather-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE}
      - SESSION_TTL=${SESSION_TTL}
      - SESSION_CLEANUP_INTERVAL=${SESSION_CLEANUP_INTERVAL}
      - OPENWEATHER_API_BASE_URL=${OPENWEATHER_API_BASE_URL}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - OPENWEATHER_REQUESTS_PER_MINUTE=${OPENWEATHER_REQUESTS_PER_MINUTE}
      - OPENWEATHER_QUEUE_SIZE=${OPENWEATHER_QUEUE_SIZE}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - LOGGER_FOLDER=/app/out/logs
      - TIME_ZONE=${TIME_ZONE}
    volumes:
      - weather-logs:/app/out/logs
    expose:
      - '5050'
    depends_on:
      weather-postgres:
        condition: service_healthy
      weather-postgres-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5050/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: always

  weather-postgres:
    image: postgres:18.1-bookworm
    container_name: weather-env-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: always

  weather-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@weather-postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    depends_on:
      weather-postgres:
        condition: service_healthy
    restart: "no"

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: weather-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:weather-postgres:5432
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    depends_on:
      weather-postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: weather-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${PROJECT_ROOT}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROJECT_ROOT}/public:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: always
    depends_on:
      weather:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: weather-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ${PROJECT_ROOT}/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: always
    depends_on:
      weather:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    container_name: weather-grafana
    ports:
      - '3000:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ${PROJECT_ROOT}/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ${PROJECT_ROOT}/monitoring/grafana-dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml:ro
      - ${PROJECT_ROOT}/monitoring/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    restart: always
    depends_on:
      - prometheus

volumes:
  weather-logs:
  prometheus-data:
  grafana-data: