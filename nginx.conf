server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Page 404
    error_page 404 /page-not-found.html;

    location = /page-not-found.html {
        internal;
    }

    # Main Page
    location = / {
        try_files /index.html =404;
    }

    # Other files
    location / {
        try_files $uri $uri/ =404;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    location /api/ {
        proxy_pass http://weather:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy для иконок OpenWeatherMap (решает проблему Mixed Content)
    location /weather-icons/ {
        proxy_pass https://openweathermap.org/img/wn/;
        proxy_ssl_server_name on;
        proxy_set_header Host openweathermap.org;
        
        # Кэшируем иконки на 7 дней
        proxy_cache_valid 200 7d;
        proxy_ignore_headers Cache-Control;
        add_header X-Cache-Status $upstream_cache_status;
        
        # CORS headers
        add_header Access-Control-Allow-Origin *;
    }
}
