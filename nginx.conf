server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Page 404
    error_page 404 /page-not-found.html;

    location = /error.html {
        internal;
    }

    # Main Page
    location = / {
        try_files /index.html =404;
    }

    # Other files
    location / {
        try_files $uri $uri/ =404;
    }

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
