# GitHub Actions Workflow для интеграционных тестов
# Использует GitHub Secrets для безопасного хранения конфиденциальных данных
#
# Необходимые secrets (Settings -> Secrets and variables -> Actions):
# - POSTGRES_USER: имя пользователя БД для тестов
# - POSTGRES_PASSWORD: пароль пользователя БД для тестов
# - POSTGRES_DB: имя тестовой базы данных

name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    # Переменные окружения для тестов
    # Используем GitHub Secrets для конфиденциальных данных
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_TIMEOUT: 5s
      HTTP_ADDR: ':5050'
      HTTP_SHUTDOWN_TIMEOUT: 30s
      ALLOWED_ORIGINS: 'http://localhost'
      LOGGER_LEVEL: DEBUG
      LOGGER_FOLDER: out/logs
      SESSION_TTL: 24h

    services:
      postgres:
        image: postgres:18-alpine
        env:
          # Используем те же secrets для создания БД в контейнере
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Verify PostgreSQL connection
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U $POSTGRES_USER -d $POSTGRES_DB -c "SELECT version();"

      - name: Download dependencies
        run: go mod download

      - name: Install golang-migrate
        run: |
          curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
          sudo mv migrate /usr/local/bin/migrate
          migrate -version

      - name: Apply database migrations
        run: |
          migrate -path migrations -database "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB?sslmode=disable" up

      - name: Run integration tests
        run: |
          go test ./internal/features/users/service -v -count=1
          go test ./internal/features/sessions/service -v -count=1

      - name: Run OpenWeather integration tests (without API key)
        env:
          OPENWEATHER_API_KEY: ''
          SKIP_TESTS_IF_NO_API_KEY: 'true'
        run: |
          go test ./internal/features/openweather/service -v -short -count=1

      - name: Run all tests with coverage
        run: |
          go test -p 1 ./... -v -count=1 -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: integration
          name: codecov-umbrella
