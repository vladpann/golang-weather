name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_TIMEOUT: 5s
      HTTP_ADDR: ':5050'
      HTTP_SHUTDOWN_TIMEOUT: 30s
      ALLOWED_ORIGINS: 'http://localhost'
      LOGGER_LEVEL: DEBUG
      LOGGER_FOLDER: out/logs
      SESSION_TTL: 24h

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Pre-pull PostgreSQL image
        run: docker pull postgres:18.1-bookworm

      - name: Run all tests with coverage
        env:
          OPENWEATHER_API_KEY: ''
          SKIP_TESTS_IF_NO_API_KEY: 'true'
        run: go test ./... -v -count=1 -timeout 10m -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: integration
          name: codecov-umbrella
