name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_TIMEOUT: 5s
      HTTP_ADDR: ':5050'
      HTTP_SHUTDOWN_TIMEOUT: 30s
      ALLOWED_ORIGINS: 'http://localhost'
      LOGGER_LEVEL: DEBUG
      LOGGER_FOLDER: out/logs
      SESSION_TTL: 24h

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Pre-pull PostgreSQL image
        run: docker pull postgres:18.1-bookworm

      - name: Run all tests with coverage
        env:
          OPENWEATHER_API_KEY: ''
          SKIP_TESTS_IF_NO_API_KEY: 'true'
        run: go test ./... -v -count=1 -timeout 10m -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: integration
          name: codecov-umbrella

name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_TIMEOUT: 5s
      HTTP_ADDR: ':5050'
      HTTP_SHUTDOWN_TIMEOUT: 30s
      ALLOWED_ORIGINS: 'http://localhost'
      LOGGER_LEVEL: DEBUG
      LOGGER_FOLDER: out/logs
      SESSION_TTL: 24h

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Pre-pull PostgreSQL image
        run: docker pull postgres:18.1-bookworm

      - name: Run all tests with coverage
        env:
          OPENWEATHER_API_KEY: ''
          SKIP_TESTS_IF_NO_API_KEY: 'true'
        run: go test ./... -v -count=1 -timeout 10m -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: integration
          name: codecov-umbrella

  docker:
    name: Docker Image
    runs-on: ubuntu-latest

    env:
      PROJECT_ROOT: ${{ github.workspace }}
      VERSION: ci
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: weather
      POSTGRES_TIMEOUT: 5s
      HTTP_SHUTDOWN_TIMEOUT: 30s
      ALLOWED_ORIGINS: 'http://localhost'
      COOKIE_SECURE: 'false'
      SESSION_TTL: 24h
      SESSION_CLEANUP_INTERVAL: 1h
      OPENWEATHER_API_BASE_URL: https://api.openweathermap.org
      OPENWEATHER_API_KEY: ci-dummy-key
      OPENWEATHER_REQUESTS_PER_MINUTE: '60'
      OPENWEATHER_QUEUE_SIZE: '100'
      LOGGER_LEVEL: DEBUG
      TIME_ZONE: UTC

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: cmd/weather/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/weather/Dockerfile
          load: true
          tags: weather:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check non-root user
        run: |
          uid=$(docker run --rm --entrypoint id weather:ci -u)
          echo "uid=$uid"
          test "$uid" != "0"

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: weather:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test (postgres, migrations, app)
        run: |
          mkdir -p out/logs out/pgdata
          sudo chown -R 10001:10001 out/logs
          docker compose up -d --wait --wait-timeout 180 weather
          docker compose exec -T weather wget -q -O - http://127.0.0.1:5050/healthz
          docker compose exec -T weather wget -q -O - http://127.0.0.1:5050/readyz

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Teardown
        if: always()
        run: docker compose down -v